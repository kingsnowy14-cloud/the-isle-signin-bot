name: Python stability checks

on:
  push:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/test-python.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/test-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile bot and dashboard
        run: python -m compileall -q bot.py dashboard.py isle_registration.py wolfchronicle.py

      - name: Run unit tests
        run: python -m unittest discover -v
